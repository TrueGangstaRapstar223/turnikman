@media (max-height:600px){
 #hud{font-size:clamp(12px,2.6vh,18px);padding-top:calc(env(safe-area-inset-top,0px) + 5px)}
 #hp{font-size:clamp(15px,3vh,22px)}#sc{font-size:clamp(18px,3.5vh,26px)}
 #fire{width:clamp(48px,10vh,76px);height:clamp(48px,10vh,76px);right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);font-size:clamp(23px,4.5vh,36px)}
 #cash{height:clamp(48px,10vh,76px);left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);font-size:clamp(11px,2.2vh,16px);padding:0 12px}
 #jmp{width:clamp(52px,11vh,84px);height:clamp(52px,11vh,84px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}

}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><span id="hp"></span><span id="sc">0 м</span><span id="bs"></span></div>
<div id="hint">Тапни — прыжок по пунктиру</div>
<div id="fire">🔫<small>5🪙</small></div>
<div id="whip" style="display:none">🕸️<small>100🪙</small></div>
<div id="jmp">JUMP</div>
<div id="cash"></div>
<div id="snd">🔊</div>
<div id="demo">ДЕМО</div>
<div id="msg"></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),msg=document.getElementById('msg'),scE=document.getElementById('sc'),bsE=document.getElementById('bs'),hpE=document.getElementById('hp');
const W=360,L=70,G=1400,SP=2.21,DEMO=false,RAKE=.08,MINM=1.3,MAXM=25,FLYINV=true;let H,S,dpr,offsetX=0;
function rs(){dpr=Math.min(devicePixelRatio||1,3);const w=innerWidth,h=innerHeight;cv.width=w*dpr;cv.height=h*dpr;S=Math.min(w/W,h/720);offsetX=(w-W*S)/2;H=h/S}
addEventListener('resize',rs);rs();
let bars=[],p=null,cam=0,state='ready',best=0,score=0,lockT=0,last=0,time=0,birds=[],bullets=[],items=[],kills=0,fireT=0,hp=1,inv=0;
let bal=1000,bet=50,up={j:0,h:0,hk:0,sk:0,own:{g:1},skin:'g'};try{Object.assign(up,JSON.parse(localStorage.getItem('tup2')||'{}'))}catch(e){}up.own.g=1;if(up.hk&&!up.own.h){up.own.h=1;if(up.sk)up.skin='h'}
try{best=+localStorage.getItem('tb')||0;bal=+localStorage.getItem('tbal2')||1000}catch(e){}
const mult=()=>Math.max(.5,Math.min(MAXM,(1+score*.06+kills*.2)*mf+adj)),net=()=>Math.floor(bet*mult()*(1-RAKE)),sv=()=>{try{localStorage.setItem('tbal2',bal)}catch(e){}};
let sj=0,holdX=null,jumpDir=1,lastJumpDir=-1,V=640,MAXHP=1,lastT='',lastX='',qOn=0,qT=35,qBusy=0,adj=0,mt=null,mT=9,mf=1,fl=0,wT=0,steps=0,topY=0,AC=null,mute=false;const spdM=()=>Math.min(2,1+steps*.08);try{mute=localStorage.getItem('tmute')==='1'}catch(e){}
function au(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function tone(f,d,ty,v,f2,dl){if(mute||!AC)return;const t=AC.currentTime+(dl||0),o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,v){if(mute||!AC)return;const n=AC.sampleRate*d|0,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;g.gain.value=v||.2;s.connect(g);g.connect(AC.destination);s.start()}
const SFX={jump:()=>tone(300,.18,'square',.1,800),grab:()=>{tone(180,.08,'triangle',.2,90);noise(.05,.1)},shot:()=>tone(900,.12,'sawtooth',.08,200),kill:()=>{noise(.18,.25);tone(500,.15,'square',.1,120)},hurt:()=>tone(200,.3,'sawtooth',.2,60),heal:()=>{tone(660,.1,'sine',.15);tone(990,.15,'sine',.15,null,.1)},coin:()=>{tone(988,.08,'square',.1);tone(1319,.25,'square',.1,null,.08)},tick:()=>tone(1200+Math.random()*400,.03,'square',.05),lose:()=>{tone(330,.3,'triangle',.2);tone(247,.3,'triangle',.2,null,.25);tone(165,.5,'triangle',.2,null,.5)},win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.18,null,i*.1)),jack:()=>{for(let i=0;i<10;i++)tone(600+i*120,.2,'square',.1,null,i*.07)},whip:()=>{noise(.12,.3);tone(1500,.15,'sawtooth',.08,300)},warn:()=>{tone(880,.12,'square',.1);tone(880,.12,'square',.1,null,.2)},boom:()=>{noise(.4,.4);tone(120,.4,'sawtooth',.25,40)}};
const sfx=n=>{try{SFX[n]()}catch(e){}};
let ms=0;setInterval(()=>{if(state!=='play'||mute||!AC)return;ms++;tone([110,110,165,110,147,110,196,165][ms%8],.2,'triangle',.07);if(ms%2)tone([440,554,659,554,880,659,554,659][ms%8],.12,'sine',.03)},230);
function hud(){scE.textContent='×'+mult().toFixed(2);hpE.textContent='❤️'.repeat(hp)+'🖤'.repeat(MAXHP-hp);bsE.textContent='🪙 '+bal;document.getElementById('demo').textContent='⚡ ×'+spdM().toFixed(1)+(up.skin==='s'?(sj>=6?' · 🕷️ ПРЫЖОК ×5!':' · 🕷️ '+(7-sj)):'');const c=document.getElementById('cash'),ok=mult()>=MINM;c.innerHTML=ok?'ЗАБРАТЬ<br>🪙 '+net():'🔒 от ×'+MINM+'<br>×'+mult().toFixed(2);c.style.opacity=ok?1:.5}
function menu(t,extra){lastT=t;lastX=extra;if(bet>bal)bet=[500,100,50,10].find(b=>b<=bal)||10;
msg.innerHTML='<h1>'+t+'</h1>'+extra+'<p>Баланс: <b>🪙 '+bal+'</b></p><p>Ставка:</p><div class="chips">'+[10,50,100,500].map(b=>'<div class="chip'+(b==bet?' on':'')+(b>bal?' off':'')+'" data-bet="'+b+'">'+b+'</div>').join('')+'</div>'+shopHtml()+skinHtml()+'<div class="go">Играть</div>'+'<p class="sm">Комиссия казино '+RAKE*100+'% с выплаты · вывод от ×'+MINM+'</p>';msg.style.display='flex'}
function cash(){if(state!=='play'||mult()<MINM)return;sfx('win');state='cash';if(score>best){best=score;try{localStorage.setItem('tb',best)}catch(e){}}
const win=net();bal+=win;sv();hud();msg.innerHTML='<h1>🎰 Бонус-слот</h1><p>Выигрыш: <b>🪙 '+win+'</b></p><div class="reels" id="rl">🎲🎲🎲</div>';msg.style.display='flex';
const sy=['🍒','🍋','💎','7️⃣','🔔'],rl=()=>sy[Math.random()*5|0];let n=0;
const iv=setInterval(()=>{n++;sfx('tick');document.getElementById('rl').textContent=rl()+rl()+rl();if(n>14){clearInterval(iv);const r=[rl(),rl(),rl()];document.getElementById('rl').textContent=r.join('');
const m=r[0]==r[1]&&r[1]==r[2]?2:(r[0]==r[1]||r[1]==r[2]||r[0]==r[2])?1.05:1,tot=Math.floor(win*m);bal+=tot-win;sv();hud();sfx(m==2?'jack':'coin');lockT=performance.now()+600;
setTimeout(()=>menu(m==2?'🎉 ДЖЕКПОТ ×2!':m>1?'✨ Бонус ×1.05':'💰 Выигрыш','<p>Выплата: <b>🪙 '+tot+'</b></p>'),1200)}},100)}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),mix=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
const stars=Array.from({length:60},()=>({x:Math.random()*W,y:Math.random()*900,k:.1+Math.random()*.3,r:.6+Math.random()*1.3}));
const clouds=Array.from({length:7},()=>({x:Math.random()*W,y:Math.random()*900,k:.25+Math.random()*.2,s:.7+Math.random()*.8}));
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function genBar(){const l=bars[bars.length-1],lv=Math.min(score/150,1),w=85-lv*30,dy=110+Math.random()*(40+lv*40);
const c=l.x+l.w/2+(Math.random()*2-1)*200,y=l.y-dy;bars.push({x:clamp(c-w/2,10,W-10-w),w,y});
if(score>6&&Math.random()<.4+lv*.3)birds.push({x:20+Math.random()*(W-40),y:y+dy/2,vx:0,tv:(Math.random()*2-1)*42,t:1,ph:Math.random()*6,f:1});
if(score>10&&Math.random()<.12)items.push({x:30+Math.random()*(W-60),y:y+dy/2+20})}
function start(){refresh();const fee=SKP[up.skin];if(bal<bet+fee){sfx('tick');const g=msg.querySelector&&msg.querySelector('.go');if(g){g.textContent='Не хватает 🪙';setTimeout(()=>g.textContent='Играть',1200)}return}bal-=bet+fee;sv();sj=0;steps=0;topY=0;wT=0;mt=null;mT=7.5;mf=1;fl=0;qOn=0;qT=35;qBusy=0;adj=0;bars=[{x:130,w:100,y:0}];score=0;cam=-H*.42;birds=[];bullets=[];items=[];kills=0;hp=MAXHP;inv=0;
p={x:180,y:0,vx:0,vy:0,th:0,om:SP,hang:true,cd:0};resetAimAngle();
while(bars[bars.length-1].y>cam-200)genBar();state='play';msg.style.display='none';hud()}
function over(){state='over';if(score>best){best=score;try{localStorage.setItem('tb',best)}catch(e){}}
if(bal<10){bal=1000;sv()}hud();sfx('lose');lockT=performance.now()+600;menu('💥 Проигрыш','<p>Ставка <b>'+bet+'</b> сгорела</p><p>Высота: <b>'+score+' м</b> · птиц: <b>'+kills+'</b></p>')}
let aimAngle=0;function resetAimAngle(){aimAngle=0;jumpDir=0}function launch(){const k=up.skin==='s'&&sj>=6?2.24:1;const a=clamp(aimAngle,-Math.PI/3,Math.PI/3);lastJumpDir=a<0?-1:1;return[k*V*Math.sin(a),-k*V*Math.cos(a)]}
function release(){const v=launch();jumpDir=0;const sup=up.skin==='s'&&sj>=6;if(up.skin==='s')sj=sup?0:sj+1;p.vx=v[0];p.vy=v[1];p.hang=false;p.cd=.15;qOn=1;p.air=1;p.fuel=1.6;p.wc=0;sfx(sup?'jack':'jump');hud();document.getElementById('hint').style.display='none'}
const SKP={g:0,s:60,h:90,i:120},SKN={g:'🤸 Гимнаст',s:'🕷️ Паук',h:'💪 Халк',i:'🤖 Железный'},SKA={g:'только стены',s:'паутина',h:'2× прыжок',i:'рывок вверх'},LC={g:'#fff',s:'#2f6bff',h:'#3bb34a',i:'#c1121f'},HC2={g:'#ff7b54',s:'#d62828',h:'#3bb34a',i:'#f4b400'};
function skinHtml(){return '<p class="sm" style="margin:10px 0 2px">Скин (способность):</p><div class="chips" style="margin:0;gap:6px;flex-wrap:wrap;justify-content:center">'+Object.keys(SKP).map(k=>'<div class="up" style="width:72px;font-size:12px'+(up.skin===k?';background:#ffd166;color:#0d1b2a':'')+'" data-sk="'+k+'">'+SKN[k]+'<br>'+SKA[k]+'<br>'+(SKP[k]?'🪙'+SKP[k]+'/кон':'бесплатно')+(up.skin===k?' ✔':'')+'</div>').join('')+'</div>'}
function pickSkin(k){up.skin=k;su();refresh();menu(lastT,lastX)}
function refresh(){V=640+45*up.j;MAXHP=1+up.h;const s=up.skin;document.getElementById('whip').style.display=s==='s'?'flex':'none';document.getElementById('jmp').style.display=s==='h'||s==='i'?'flex':'none';document.getElementById('jmp').textContent=s==='i'?'FLY':'JUMP'}
const su=()=>{try{localStorage.setItem('tup2',JSON.stringify(up))}catch(e){}},JC=[200,400,700,1100,1600],HC=[300,600,1000,1500],HK=1500;
function spend(n){if(bal<n){sfx('tick');return false}bal-=n;sv();hud();return true}
function buy(k){if(k==='j'){if(up.j>=JC.length||bal<JC[up.j]){sfx('tick');return}bal-=JC[up.j];up.j++}
else if(k==='h'){if(up.h>=HC.length||bal<HC[up.h]){sfx('tick');return}bal-=HC[up.h];up.h++}
else if(k==='hk'){if(up.hk)up.sk=up.sk?0:1;else{if(bal<HK){sfx('tick');return}bal-=HK;up.hk=1;up.sk=1}}
sv();su();refresh();hud();sfx('coin');menu(lastT,lastX)}
function shopHtml(){const j=up.j>=JC.length,h=up.h>=HC.length,b=(k,t,l,c,off)=>'<div class="up'+(off?' off':'')+'" data-up="'+k+'">'+t+'<br>'+l+'<br>'+c+'</div>';
return '<div class="chips" style="margin:10px 0 0;gap:8px">'+b('j','🦘 Прыжок',(up.j+1)+'/'+(JC.length+1),j?'МАКС':'🪙'+JC[up.j],!j&&bal<JC[up.j])+b('h','❤️ Здоровье',(up.h+1)+'/'+(HC.length+1),h?'МАКС':'🪙'+HC[up.h],!h&&bal<HC[up.h])+'</div>'}
function ask(){state='quiz';const lose=Math.min(2.8,Math.max(0,mult()-.5)).toFixed(1);
msg.innerHTML='<h1>☄️ Сверху летит метеорит!</h1><p>Куда увернёшься?</p><p class="sm">Угадал сторону: <b>+0,3×</b><br>Не угадал: <b>'+(mult()<3.3?'без штрафа':'−2,8×')+'</b><br>Шанс 50 на 50</p><div class="top" data-q="L" style="font-size:22px;padding:14px 40px">⬅️ Влево</div><div class="top" data-q="R" style="font-size:22px;padding:14px 40px">Вправо ➡️</div>';msg.style.display='flex'}
function answer(s){if(state!=='quiz'||qBusy)return;qBusy=1;const m=Math.random()<.5?'L':'R',ok=s===m,bf=mult(),want=ok?.3:(bf<3.3?0:-2.8),real=want;adj+=real;hud();sfx(ok?'coin':'boom');
msg.innerHTML='<h1>'+(ok?'✅ Угадал!':'💥 Не угадал')+'</h1><p>Метеорит упал '+(m==='L'?'слева':'справа')+'</p><p><b>'+(real>0?'+':real<0?'−':'±')+Math.abs(real).toFixed(1)+'×</b></p>';
setTimeout(()=>{msg.style.display='none';qBusy=0;state='play'},1500)}
function fly(){if(state!=='play'||p.whip)return;if(p.hang||p.wc){p.hang=false;p.cd=.15;qOn=1;p.air=0;p.wc=0;p.wcd=.2;p.vx=0;p.vy=-V*1.58;p.thr=.6;document.getElementById('hint').style.display='none';sfx('whip');return}jump2()}
function act(){if(p.hang)release();else jump2()}
function jump2(){if(state!=='play'||p.hang||p.whip)return;
if(p.wc){p.vx=-p.wc*V*.6;p.vy=-V*.85;p.wc=0;p.wcd=.2;p.air=1;p.fuel=1.6;sfx('jump');return}
if(p.air&&up.skin==='h'){p.air=0;p.vy=-V*.8;p.vx*=.6;sfx('jump')}
else if(p.air&&up.skin==='i'){p.air=0;p.vy=-V*1.58;p.vx*=.3;p.thr=.6;sfx('whip')}}
function whip(){if(up.skin!=='s'||wT>0||p.whip)return;let t=null,d=1e9;for(const b of bars){const tx=clamp(p.x,b.x,b.x+b.w),dd=Math.hypot(tx-p.x,b.y-p.y);if(b.y<p.y-15&&dd<d&&dd<=280){d=dd;t=b}}if(!t){sfx('tick');return}if(!spend(100))return;wT=3.2;p.hang=false;p.wc=0;p.whip={x:clamp(p.x,t.x,t.x+t.w),y:t.y,b:t};sfx('whip')}
function grab(b){p.x=clamp(p.x,b.x,b.x+b.w);p.y=b.y;resetAimAngle();p.hang=true;p.whip=null;p.wc=0;p.thr=0;sfx('grab');p.om=(p.vx<0?-1:1)*SP*spdM();if(b.y<topY){topY=b.y;steps++}score=Math.max(score,Math.floor(-b.y/10));hud()}
function shoot(){if(fireT>0||!spend(5))return;fireT=.3;sfx('shot');let t=null,d=1e9;for(const e of birds){const dd=Math.hypot(e.x-p.x,e.y-p.y);if(dd<d&&e.y>cam-20&&e.y<cam+H){d=dd;t=e}}
